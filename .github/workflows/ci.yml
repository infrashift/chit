name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Server jobs run with GOWORK=off so the root module is proven to resolve
# standalone from its own go.mod, independent of the go.work workspace that
# also covers clients/chit-tui.
jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests (race)
        run: go test -race -count=1 ./...
      - name: Dependency boundaries
        run: make check-deps

  tui-build-and-test:
    name: TUI build & tests
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    defaults:
      run:
        working-directory: clients/chit-tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/chit-tui/go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Vet e2e (build-tagged)
        run: go vet -tags e2e ./tests/e2e/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Lint is fully enforced: the backlog is cleared, so any finding fails
      # the build. Build tags bring the integration and e2e files into scope,
      # which an untagged run never compiles. v8 of the action is the first to
      # run golangci-lint v2, which .golangci.yml is written for.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --build-tags integration,e2e
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tui-lint:
    name: TUI lint
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/chit-tui/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: clients/chit-tui
          only-new-issues: true

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chit
          POSTGRES_PASSWORD: chit
          POSTGRES_DB: chit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHIT_DATABASE_URL: postgres://chit:chit@localhost:5432/chit?sslmode=disable
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
      # Up, all the way down, and up again: a broken down migration fails
      # here rather than during a rollback.
      - name: Run migrations (round trip)
        run: |
          migrate -database "$CHIT_DATABASE_URL" -path migrations up
          migrate -database "$CHIT_DATABASE_URL" -path migrations down -all
          migrate -database "$CHIT_DATABASE_URL" -path migrations up
      - name: Integration tests
        run: go test -race -count=1 -tags integration ./internal/store/sqlstore/... ./internal/pubsub/...

  validate:
    name: Validate OpenAPI & CUE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate CUE definitions
        run: make cue-validate
      - name: Validate OpenAPI spec
        run: make validate-spec
