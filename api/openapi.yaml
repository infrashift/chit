openapi: "3.1.0"
info:
  title: Chit API
  version: "0.1.0"
  description: |
    REST API for Chit, a stripped-down team messaging server.

    ## Authentication
    chitd sits behind Ory Oathkeeper and trusts the identity headers it sets;
    it validates no session or token itself. Every endpoint except
    `/system/ping`, `/system/config/client`, `/openapi.yaml` and `/docs/`
    needs one of:

    - `X-Client-Id`: the OAuth2 client of a machine actor (an agent or bot),
      set by Oathkeeper after introspecting a Hydra client-credentials token.
      It wins over `X-User-Id`. The client must be bound to a user, declared
      with `CHIT_MACHINE_ACTORS`; an unknown client is a 401, never created.
    - `X-User-Id`: a person's Ory Kratos identity ID. The first request from
      an identity provisions its user record from Kratos.

    When `CHIT_TRUSTED_PROXY_SECRET` is set, the proxy must also send it in
    `X-Proxy-Secret`. (Through the Oathkeeper gateway, every `/api/v1` route,
    the public ones included, needs a session or token.)

    ## Authorization
    Channel membership is the access check for everything in a channel.
    Operations a caller may not perform answer 403.

    ## Pagination
    List endpoints accept `page` (0-indexed) and `per_page` (default 60,
    at most 200). `page * per_page` is capped at 100,000.

    ## Errors and limits
    Failures return an `AppError`. A 5xx carries no `detailed_error`; the
    cause is logged server-side. Request bodies over 1 MiB are refused with
    413. Each user may make 10 requests a second, in bursts of up to 50;
    beyond that requests are refused with 429.

    ## IDs
    All resource IDs are UUIDv7 strings.

    ## Timestamps
    All `*_at` fields are Unix millisecond timestamps (int64).

servers:
  - url: /api/v1
    description: Default API prefix

security:
  - clientId: []
  - userId: []

tags:
  - name: System
    description: Health checks and client configuration
  - name: Users
    description: User management and lookup
  - name: Teams
    description: Team CRUD and membership
  - name: Channels
    description: Channel CRUD, DM/GM creation, membership, and read tracking
  - name: Posts
    description: Message CRUD, pinning, and retrieval
  - name: Threads
    description: Thread views, following, and read tracking
  - name: Tags
    description: Tag CRUD and post-tag associations
  - name: Search
    description: Post search, by SQL or by ZincSearch when it is configured
  - name: Commands
    description: Slash command registry and discovery
  - name: WebSocket
    description: Real-time event streaming

paths:
  # ──────────────────────────── System ────────────────────────────
  /system/ping:
    get:
      operationId: system_ping
      summary: Health check
      description: Returns OK if the server is running. No authentication required.
      tags: [System]
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: OK

  /system/config/client:
    get:
      operationId: system_client_config
      summary: Client configuration
      description: |
        Returns public configuration values that clients need at startup,
        such as the server version. No authentication required.
      tags: [System]
      security: []
      responses:
        "200":
          description: Client configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "0.1.0"

  # ──────────────────────────── Users ─────────────────────────────
  /users:
    post:
      operationId: create_user
      summary: Create a user
      description: |
        Creates a user record. System admins only. People are normally
        provisioned automatically on their first request, and machine actors
        are declared with `CHIT_MACHINE_ACTORS`, which the server reconciles at
        every boot; this endpoint covers what neither does, such as addressing
        a person who has never signed in.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: search_users
      summary: Search users
      description: |
        Search users by username or display name (case-insensitive
        substring; `%` and `_` match literally). Email is not searched.
        Returns a paginated list ordered by username, with email and
        kratos_id redacted.
      tags: [Users]
      parameters:
        - name: term
          in: query
          description: Search term to match against username or display_name
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: List of matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    get:
      operationId: get_me
      summary: Get current user
      description: Returns the full profile of the authenticated user, including email.
      tags: [Users]
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: update_me
      summary: Update current user
      description: |
        Updates the authenticated user's profile. Only `display_name` and
        `username` can be changed; other fields are ignored. A field left out
        is unchanged. The username is lowercased and validated, and must not
        be taken by another user.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 100
                username:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}:
    get:
      operationId: get_user
      summary: Get user by ID
      description: Returns a user's public profile, with email and kratos_id redacted.
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: User profile (email redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/username/{username}:
    get:
      operationId: get_user_by_username
      summary: Get user by username
      description: Look up a user by their unique username. Email is redacted.
      tags: [Users]
      parameters:
        - name: username
          in: path
          required: true
          description: The unique username to look up
          schema:
            type: string
      responses:
        "200":
          description: User profile (email redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/ids:
    post:
      operationId: get_users_by_ids
      summary: Get users by IDs
      description: |
        Batch-fetch up to 200 users by their IDs. Useful for resolving user
        references in posts and channel members. Unknown IDs are skipped;
        email and kratos_id are redacted.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              maxItems: 200
              example:
                - "0192d4c1-7e2a-7000-8000-000000000001"
                - "0192d4c1-7e2a-7000-8000-000000000002"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────── Teams ─────────────────────────────
  /teams:
    post:
      operationId: create_team
      summary: Create a team
      description: |
        Creates a new team. The authenticated user becomes the team creator
        and is automatically added as a team member with `team_admin team_user`
        roles.
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: get_all_teams
      summary: List teams
      description: |
        Returns the teams the caller can see: open teams, plus the
        invite-only teams they belong to. System admins see every team.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Paginated team list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}:
    get:
      operationId: get_team
      summary: Get team by ID
      description: |
        Open teams are visible to everyone; invite-only teams only to their
        members and to system admins.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      responses:
        "200":
          description: Team details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: update_team
      summary: Update a team
      description: |
        Updates a team's display_name, description, or type. Requires
        team_admin (granted to the team's creator) or system_admin. A field
        left out is unchanged; an empty description clears it. The team name
        (URL slug) cannot be changed: sending `name` is a 400.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: delete_team
      summary: Delete a team
      description: |
        Soft-deletes a team and every channel on it. Requires team_admin or
        system_admin. A `channel_deleted` event is sent for each channel.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      responses:
        "200":
          description: Team deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/teams:
    get:
      operationId: get_my_teams
      summary: Get teams for current user
      description: Returns all teams the authenticated user is a member of.
      tags: [Teams]
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}/members:
    post:
      operationId: add_team_member
      summary: Add a team member
      description: |
        Adds a user to a team with the `team_user` role. Anyone may join an
        open team themselves (`user_id` is their own); adding someone else,
        or joining an invite-only team, requires the caller to be a member.
        The user must exist. Adding an existing member changes nothing; in
        particular their roles are kept.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Team member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: get_team_members
      summary: Get team members
      description: Returns a paginated list of a team's members. Members and system admins only.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /teams/{id}/members/{user_id}:
    delete:
      operationId: remove_team_member
      summary: Remove a team member
      description: |
        Removes a user from a team, and from every channel on it. A member may
        remove themselves; removing anyone else requires system_admin.
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
        - name: user_id
          in: path
          required: true
          description: ID of the user to remove
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────── Channels ──────────────────────────
  /channels:
    post:
      operationId: create_channel
      summary: Create a channel
      description: |
        Creates an Open or Private channel within a team; the caller must be a
        member of the team. The creator becomes a member, and an Open channel
        also gets every team member. Direct and group channels are created with
        `/channels/direct` and `/channels/group`, not here. A
        `channel_created` WebSocket event is broadcast (to the team for an
        Open channel, otherwise to the channel).
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/{id}:
    get:
      operationId: get_channel
      summary: Get channel by ID
      description: |
        Members may read any channel; members of the team may read an Open
        channel. Private, direct and group channels are not visible to
        non-members.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "200":
          description: Channel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: update_channel
      summary: Update a channel
      description: |
        Updates a channel's display_name, header, or purpose; the caller must
        be a member. A field left out is unchanged; an empty header or purpose
        clears it. The name cannot be changed: sending `name` is a 400.
        Broadcasts a `channel_updated` WebSocket event.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: delete_channel
      summary: Delete a channel
      description: |
        Soft-deletes a channel. Only its creator or a system admin may. Once
        deleted, a channel has no members for any access check. Broadcasts a
        `channel_deleted` WebSocket event.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "200":
          description: Channel deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/channels:
    get:
      operationId: get_channels_for_team
      summary: Get channels for a team
      description: |
        Returns a team's Open channels, the ones any member may browse and
        join. Team members only. Private channels are listed to their members
        by `/users/me/teams/{id}/channels`.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/me/teams/{id}/channels:
    get:
      operationId: get_my_channels
      summary: Get my channels in a team
      description: Returns channels the authenticated user is a member of within a specific team.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      responses:
        "200":
          description: List of channels the user belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/channels/direct:
    get:
      operationId: get_my_direct_channels
      summary: Get my direct message channels
      description: Returns all direct-message and group-message channels the authenticated user is a member of.
      tags: [Channels]
      responses:
        "200":
          description: List of DM/GM channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /channels/direct:
    post:
      operationId: create_direct_channel
      summary: Create a direct message channel
      description: |
        Creates a 1:1 DM channel between two different users, one of whom
        must be the caller. The channel name is the sorted user IDs joined by
        `__`. If the DM already exists (including one created concurrently),
        the existing channel is returned. A DM's membership is fixed.
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              minItems: 2
              maxItems: 2
              description: Exactly 2 user IDs
              example:
                - "0192d4c1-7e2a-7000-8000-000000000001"
                - "0192d4c1-7e2a-7000-8000-000000000002"
      responses:
        "201":
          description: DM channel created or returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/group:
    post:
      operationId: create_group_channel
      summary: Create a group message channel
      description: |
        Creates a group message channel with 3-8 distinct members, one of whom
        must be the caller. Repeated IDs count once; every ID must name an
        existing user. If a group with exactly these members exists, it is
        returned. A group's membership is fixed.
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              minItems: 3
              maxItems: 8
              description: 3-8 user IDs
      responses:
        "201":
          description: Group channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/{id}/members:
    post:
      operationId: add_channel_member
      summary: Add a channel member
      description: |
        Adds a user to an Open or Private channel. For an Open channel any
        team member may add; for a Private one only its members. The user
        added must be on the channel's team. Direct and group channels have a
        fixed membership (403). Adding an existing member changes nothing.
        Broadcasts a `user_added` WebSocket event to the channel.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Channel member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: get_channel_members
      summary: Get channel members
      description: Channel members only.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: List of channel members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/{id}/members/{user_id}:
    delete:
      operationId: remove_channel_member
      summary: Remove a channel member
      description: |
        Removes a user from a channel. A member may remove themselves;
        removing anyone else requires system_admin. Broadcasts a
        `user_removed` WebSocket event.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
        - name: user_id
          in: path
          required: true
          description: ID of the user to remove
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels/{id}/members/me/view:
    post:
      operationId: view_channel
      summary: Mark channel as viewed
      description: |
        Updates the authenticated user's `last_viewed_at` timestamp for a
        channel, clearing the unread indicator and mention count. Members
        only.
      tags: [Channels]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "200":
          description: Channel marked as viewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────── Posts ─────────────────────────────
  /posts:
    post:
      operationId: create_post
      summary: Create a post
      description: |
        Creates a message in a channel the caller is a member of. Only
        `channel_id`, `root_id`, `content` and `props` are read; `props.mentions`
        is computed by the server.

        If `root_id` is set the post is a thread reply. The root must exist,
        be in the same channel, and be a root rather than a reply. The thread's
        counters are updated, the replier follows the thread (read up to their
        reply), and the root's author follows it from its first reply unless
        they have unfollowed. A `thread_updated` event carries the counters.

        A message that is a registered slash command (e.g. `/help`) is run, not
        stored: the response is a stand-in post of type `command_response`
        with `props.ephemeral` true, and a `command_response` WebSocket event
        is sent to the caller.

        A `posted` WebSocket event is broadcast to the channel, and each user
        mentioned gets a `mentioned` event.
      tags: [Posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /posts/{id}:
    get:
      operationId: get_post
      summary: Get post by ID
      description: Returns a single post by ID. Members of its channel only.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: Post details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: update_post
      summary: Update a post
      description: |
        Edits a post; its author or a system admin only. `content`, when
        present, replaces the text. `props` are merged key by key into the
        existing props, and a null value removes its key. Sets `edit_at`,
        re-parses mentions, and returns the whole post. Broadcasts a
        `post_edited` WebSocket event carrying the whole post.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 65535
                  description: Updated message content (markdown)
                props:
                  type: object
                  additionalProperties: true
                  description: Props to set; a null value removes the key
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: delete_post
      summary: Delete a post
      description: |
        Soft-deletes a post; its author or a system admin only. Deleting a
        reply updates its thread's counters (and sends `thread_updated`).
        Broadcasts a `post_deleted` WebSocket event.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/pin:
    post:
      operationId: pin_post
      summary: Pin a post
      description: Pins a post in its channel; channel members only. Broadcasts a `post_pinned` WebSocket event.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: Post pinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/unpin:
    post:
      operationId: unpin_post
      summary: Unpin a post
      description: Unpins a post; channel members only. Broadcasts a `post_unpinned` WebSocket event.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: Post unpinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels/{id}/posts:
    get:
      operationId: get_channel_posts
      summary: Get posts in a channel
      description: |
        Returns a page of a channel's posts; members only. Without `since`
        posts come newest first (history); with `since` only posts created
        after it are returned, oldest first, for clients polling for new
        messages.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: since
          in: query
          description: Return posts created after this Unix millisecond timestamp
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/{id}/pinned:
    get:
      operationId: get_pinned_posts
      summary: Get pinned posts in a channel
      description: Returns all pinned posts in a channel, newest first; members only.
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "200":
          description: Pinned posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────── Threads ───────────────────────────
  /posts/{id}/thread:
    get:
      operationId: get_thread
      summary: Get a thread
      description: |
        Returns the root post followed by every reply, oldest first, as a
        `PostList`. Members of the thread's channel only.
      tags: [Threads]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: The root and its replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/teams/{id}/threads:
    get:
      operationId: get_my_threads
      summary: Get my threads in a team
      description: |
        Returns threads the authenticated user follows within a team, newest
        reply first, with unread status. Only threads in channels the user is
        still a member of, whose root and channel are not deleted, are listed.
        Paginated, defaulting to 25 per page.
      tags: [Threads]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
        - $ref: "#/components/parameters/PageParam"
        - name: per_page
          in: query
          description: Number of items per page (default 25)
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: List of followed threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/teams/{team_id}/threads/{id}/read:
    put:
      operationId: mark_thread_as_read
      summary: Mark thread as read
      description: |
        Updates the user's `last_viewed_at` for a thread and clears its
        unread mentions. `id` must be a thread root (400 otherwise) in a
        channel the caller is a member of; 404 if the caller has no
        membership of the thread. `team_id` is not checked.
      tags: [Threads]
      parameters:
        - name: team_id
          in: path
          required: true
          description: Team ID (for scoping)
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          description: Thread root post ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thread marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/teams/{team_id}/threads/{id}/following:
    put:
      operationId: update_thread_following
      summary: Follow or unfollow a thread
      description: |
        Sets whether the authenticated user follows a thread. A followed
        thread appears in their thread list and counts mentions. `id` must be
        a thread root (400 otherwise) in a channel the caller is a member of.
      tags: [Threads]
      parameters:
        - name: team_id
          in: path
          required: true
          description: Team ID (for scoping)
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          description: Thread root post ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [following]
              properties:
                following:
                  type: boolean
                  description: Whether to follow (true) or unfollow (false)
      responses:
        "200":
          description: Thread following updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/threads/direct:
    get:
      operationId: get_my_direct_threads
      summary: Get my threads in direct and group channels
      description: |
        Returns the threads the authenticated user follows in direct and
        group channels, newest reply first, with unread status. Those
        channels belong to no team, so these threads never appear in a team's
        thread list. Same filtering as the team list: only channels the user
        is still a member of, whose root and channel are not deleted.
        Paginated, defaulting to 25 per page.
      tags: [Threads]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: per_page
          in: query
          description: Number of items per page (default 25)
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: List of followed threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/threads/{id}/read:
    put:
      operationId: mark_thread_as_read_without_team
      summary: Mark thread as read (any channel)
      description: |
        As `/users/me/teams/{team_id}/threads/{id}/read`, which ignores its
        `team_id`; this form needs none, for threads in direct and group
        channels.
      tags: [Threads]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: Thread marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/threads/{id}/following:
    put:
      operationId: update_thread_following_without_team
      summary: Follow or unfollow a thread (any channel)
      description: |
        As `/users/me/teams/{team_id}/threads/{id}/following`, which ignores
        its `team_id`; this form needs none, for threads in direct and group
        channels.
      tags: [Threads]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [following]
              properties:
                following:
                  type: boolean
      responses:
        "200":
          description: Thread following updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────── Tags ──────────────────────────────
  /tags:
    post:
      operationId: create_tag
      summary: Create a tag
      description: |
        Creates a tag that can be applied to posts. Idempotent by name:
        creating a name that exists returns the existing tag.
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                  description: Unique tag name
                  example: "bug"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: get_all_tags
      summary: List all tags
      tags: [Tags]
      responses:
        "200":
          description: All tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Deliberately under /tags rather than /posts/tags: the latter collides with
  # the /posts/{id} routes, where the router binds id="tags" and answers 405.
  /tags/posts:
    post:
      operationId: get_tags_for_posts
      summary: Get tags for many posts at once
      description: >
        Returns tags keyed by post ID, for every requested post the caller can
        read. Posts in channels they are not a member of are omitted rather
        than refused, so one inaccessible ID does not fail the batch. Replaces
        one request per post when opening a channel.
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_ids]
              properties:
                post_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Tags keyed by post ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/{id}/tags:
    post:
      operationId: add_tag_to_post
      summary: Add a tag to a post
      description: Associates an existing tag with a post; members of its channel only.
      tags: [Tags]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id]
              properties:
                tag_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Tag added to post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: get_tags_for_post
      summary: Get tags for a post
      tags: [Tags]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
      responses:
        "200":
          description: Tags associated with the post
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /posts/{id}/tags/{tag_id}:
    delete:
      operationId: remove_tag_from_post
      summary: Remove a tag from a post
      tags: [Tags]
      parameters:
        - $ref: "#/components/parameters/PostIdParam"
        - name: tag_id
          in: path
          required: true
          description: Tag ID to remove
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tag removed from post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────── Search ────────────────────────────
  /posts/search:
    post:
      operationId: search_posts
      summary: Search posts globally
      description: |
        Searches posts in every channel the caller is a member of. Every
        filter, scope included, is applied before the page is cut, so a page
        is never short because unreadable hits were dropped. With
        `CHIT_ZINCSEARCH_URL` set, terms are matched by ZincSearch (in its
        relevance order; SQL is used only if Zinc fails); otherwise by a
        case-insensitive substring match, newest first.
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}/posts/search:
    post:
      operationId: search_posts_in_team
      summary: Search posts in a team
      description: |
        As `/posts/search`, limited to the caller's channels on this team.
        Team members only.
      tags: [Search]
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/{id}/posts/search:
    post:
      operationId: search_posts_in_channel
      summary: Search posts in a channel
      description: As `/posts/search`, limited to one channel. Channel members only.
      tags: [Search]
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────── Commands ──────────────────────────
  /commands:
    get:
      operationId: list_commands
      summary: List available slash commands
      description: |
        Returns the list of registered slash commands. Commands are loaded
        from the CUE definitions in the auth/ directory at server start.
        If no commands are loaded, an empty array is returned.
      tags: [Commands]
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────── WebSocket ─────────────────────────
  /websocket:
    get:
      operationId: handle_web_socket
      summary: WebSocket connection
      description: |
        Upgrades the HTTP connection to a WebSocket for real-time events:
        posted, post_edited, post_deleted, post_pinned, post_unpinned,
        typing, channel_created, channel_updated, channel_deleted,
        user_added, user_removed, thread_updated, mentioned,
        command_response. Channel and team events reach only members.

        Clients may send one action, `typing`, for a channel they belong to;
        inbound messages are limited to 4096 bytes. The server sends ping
        frames for keepalive, and disconnects a client whose 256-event send
        buffer is full. Browser origins must be in `CHIT_ALLOWED_ORIGINS`.
      tags: [WebSocket]
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "401":
          $ref: "#/components/responses/Unauthorized"

# ═══════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: A machine actor's OAuth2 client ID, set by Oathkeeper.
    userId:
      type: apiKey
      in: header
      name: X-User-Id
      description: A person's Kratos identity ID, set by Oathkeeper.

  # ──────── Reusable Parameters ───────
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (0-indexed)
      schema:
        type: integer
        default: 0
        minimum: 0
    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        type: integer
        default: 60
        minimum: 1
        maximum: 200
    UserIdParam:
      name: id
      in: path
      required: true
      description: User ID (UUIDv7)
      schema:
        type: string
        format: uuid
    TeamIdParam:
      name: id
      in: path
      required: true
      description: Team ID (UUIDv7)
      schema:
        type: string
        format: uuid
    ChannelIdParam:
      name: id
      in: path
      required: true
      description: Channel ID (UUIDv7)
      schema:
        type: string
        format: uuid
    PostIdParam:
      name: id
      in: path
      required: true
      description: Post ID (UUIDv7)
      schema:
        type: string
        format: uuid

  # ──────── Reusable Responses ────────
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"

  # ──────── Schemas ───────────────────
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "OK"

    AppError:
      type: object
      description: Structured error returned by all endpoints on failure
      properties:
        id:
          type: string
          description: Error identifier (usually the handler name)
        message:
          type: string
          description: Human-readable error message
        detailed_error:
          type: string
          description: Additional error details (may be empty)
        status_code:
          type: integer
          description: HTTP status code
      example:
        id: createPost
        message: invalid request body
        detailed_error: ""
        status_code: 400

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kratos_id:
          type: string
          description: |
            A person's Ory Kratos identity ID. Empty for machine actors, and
            redacted when one user reads another.
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$"
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          description: |
            Only visible to the user themselves; redacted for other users.
            Empty for machine actors.
        roles:
          type: string
          description: Space-separated role list (e.g. "system_user system_admin")
        actor_type:
          type: string
          enum: [user, agent, bot]
          description: "user for people; agent or bot for machine actors"
        oauth_client_id:
          type: string
          description: |
            A machine actor's OAuth2 client ID. Omitted for people, and
            redacted when one user reads another.
        create_at:
          type: integer
          format: int64
          description: Unix millisecond timestamp
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
          description: "0 if not deleted"
      example:
        id: "0192d4c1-7e2a-7000-8000-000000000001"
        kratos_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        username: "jdoe"
        display_name: "Jane Doe"
        email: ""
        roles: "system_user"
        actor_type: "user"
        create_at: 1700000000000
        update_at: 1700000000000
        delete_at: 0

    CreateUserRequest:
      type: object
      description: |
        A person needs `kratos_id` and `email`; a machine actor needs
        `oauth_client_id` instead, and an `actor_type` of agent or bot.
      required: [username, display_name]
      properties:
        kratos_id:
          type: string
          format: uuid
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$"
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        roles:
          type: string
          description: Space-separated; defaults to "system_user"
        actor_type:
          type: string
          enum: [user, agent, bot]
          default: user
        oauth_client_id:
          type: string

    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
          description: URL-safe team slug (immutable after creation)
        display_name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        type:
          type: string
          enum: ["O", "I"]
          description: "O = Open (anyone can join), I = Invite-only"
        creator_id:
          type: string
          format: uuid
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
      example:
        id: "0192d4c1-7e2a-7000-8000-000000000010"
        name: "engineering"
        display_name: "Engineering"
        description: "Engineering team discussions"
        type: "O"
        creator_id: "0192d4c1-7e2a-7000-8000-000000000001"
        create_at: 1700000000000
        update_at: 1700000000000
        delete_at: 0

    CreateTeamRequest:
      type: object
      required: [name, display_name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
        display_name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        type:
          type: string
          enum: ["O", "I"]
          default: "O"

    UpdateTeamRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        type:
          type: string
          enum: ["O", "I"]

    TeamMember:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roles:
          type: string
          description: Space-separated role list (e.g. "team_user team_admin")
        create_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
      example:
        team_id: "0192d4c1-7e2a-7000-8000-000000000010"
        user_id: "0192d4c1-7e2a-7000-8000-000000000001"
        roles: "team_user"
        create_at: 1700000000000
        delete_at: 0

    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
          description: Null for DM and Group channels
        creator_id:
          type: string
          format: uuid
        name:
          type: string
          description: URL-safe channel slug (auto-generated for DM/Group)
        display_name:
          type: string
          maxLength: 64
        header:
          type: string
          maxLength: 1024
          description: Channel header (markdown)
        purpose:
          type: string
          maxLength: 250
        type:
          type: string
          enum: ["O", "P", "D", "G"]
          description: "O = Open, P = Private, D = Direct Message, G = Group Message"
        total_msg_count:
          type: integer
          format: int64
        last_post_at:
          type: integer
          format: int64
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
      example:
        id: "0192d4c1-7e2a-7000-8000-000000000020"
        team_id: "0192d4c1-7e2a-7000-8000-000000000010"
        creator_id: "0192d4c1-7e2a-7000-8000-000000000001"
        name: "general"
        display_name: "General"
        header: "Welcome to the general channel"
        purpose: "General discussion"
        type: "O"
        total_msg_count: 42
        last_post_at: 1700000060000
        create_at: 1700000000000
        update_at: 1700000000000
        delete_at: 0

    CreateChannelRequest:
      type: object
      required: [team_id, name, display_name, type]
      properties:
        team_id:
          type: string
          format: uuid
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
        display_name:
          type: string
          maxLength: 64
        header:
          type: string
          maxLength: 1024
        purpose:
          type: string
          maxLength: 250
        type:
          type: string
          enum: ["O", "P"]
          description: "O = Open, P = Private"

    UpdateChannelRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
        header:
          type: string
          maxLength: 1024
        purpose:
          type: string
          maxLength: 250

    ChannelMember:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roles:
          type: string
        last_viewed_at:
          type: integer
          format: int64
        msg_count:
          type: integer
          format: int64
        mention_count:
          type: integer
          format: int64
        notify_props:
          type: object
          additionalProperties: true
        create_at:
          type: integer
          format: int64

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        root_id:
          type: string
          format: uuid
          description: Set when this post is a thread reply; references the root post
        content:
          type: string
          maxLength: 65535
          description: Message content (markdown).
        type:
          type: string
          description: Post type (empty for normal messages)
        props:
          type: object
          additionalProperties: true
          description: Arbitrary key-value metadata
        hashtags:
          type: string
          description: Reserved; not currently populated
        is_pinned:
          type: boolean
        edit_at:
          type: integer
          format: int64
          description: "0 if never edited"
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
      example:
        id: "0192d4c1-7e2a-7000-8000-000000000030"
        channel_id: "0192d4c1-7e2a-7000-8000-000000000020"
        user_id: "0192d4c1-7e2a-7000-8000-000000000001"
        root_id: ""
        content: "Hello, world!"
        type: ""
        props: {}
        hashtags: ""
        is_pinned: false
        edit_at: 0
        create_at: 1700000060000
        update_at: 1700000060000
        delete_at: 0

    CreatePostRequest:
      type: object
      required: [channel_id, content]
      properties:
        channel_id:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 65535
          description: Message content (markdown)
        root_id:
          type: string
          format: uuid
          description: Set to reply to a thread (root post ID)
        props:
          type: object
          additionalProperties: true

    PostList:
      type: object
      properties:
        order:
          type: array
          items:
            $ref: "#/components/schemas/Post"
          description: Posts in display order

    Thread:
      type: object
      properties:
        post_id:
          type: string
          format: uuid
          description: Root post ID
        channel_id:
          type: string
          format: uuid
        reply_count:
          type: integer
        last_reply_at:
          type: integer
          format: int64
        participants:
          type: array
          items:
            type: string
            format: uuid
          description: User IDs who have replied to this thread

    ThreadMembership:
      type: object
      properties:
        post_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        following:
          type: boolean
        last_viewed_at:
          type: integer
          format: int64
        unread_mention_count:
          type: integer

    ThreadResponse:
      type: object
      description: |
        A thread in a user's thread list: its metadata, its root post (alone,
        enough to show what the thread is about), and the user's read state.
      properties:
        thread:
          $ref: "#/components/schemas/Thread"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        last_viewed_at:
          type: integer
          format: int64
          description: >
            When the caller last read this thread. The thread is unread when
            `thread.last_reply_at` is later. Zero means never read. Set only
            in a user's thread list.
        unread_mentions:
          type: integer
          description: >
            Mentions of the caller since they last read the thread. Set only
            in a user's thread list.

    UserThreadList:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ThreadResponse"
        total:
          type: integer
          format: int64
          description: Total number of threads the user is following

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
      example:
        id: "0192d4c1-7e2a-7000-8000-000000000040"
        name: "bug"

    MessageTag:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        tag_id:
          type: string
          format: uuid

    Command:
      type: object
      properties:
        id:
          type: string
          description: Unique command identifier
        slug:
          type: string
          description: The slash command trigger (e.g. "help" for /help)
        description:
          type: string
          description: Human-readable description of the command
        category:
          type: string
          description: Command category (e.g. "chat", "admin", "agent")
      example:
        id: "help"
        slug: "help"
        description: "List available commands"
        category: "chat"

    SearchRequest:
      type: object
      description: At least one of `terms` and `tag_ids` is required.
      properties:
        terms:
          type: string
          description: Text to find in post content
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Only posts carrying every one of these tags
        from:
          type: string
          description: Only posts by this username (a leading @ is accepted)
        page:
          type: integer
          default: 0
          minimum: 0
        per_page:
          type: integer
          default: 60
          minimum: 1
          maximum: 200

    WebSocketEvent:
      type: object
      description: Event pushed to clients over WebSocket
      properties:
        event:
          type: string
          enum:
            - posted
            - post_edited
            - post_deleted
            - post_pinned
            - post_unpinned
            - typing
            - channel_created
            - channel_updated
            - channel_deleted
            - user_added
            - user_removed
            - thread_updated
            - mentioned
            - command_response
        data:
          type: object
          additionalProperties: true
        broadcast:
          $ref: "#/components/schemas/WebSocketBroadcast"
        seq:
          type: integer
          format: int64
          description: |
            Not set by chitd. chit-mcp numbers the events it buffers for
            agents, and only there is it meaningful.

    WebSocketBroadcast:
      type: object
      description: Controls which clients receive a WebSocket event
      properties:
        channel_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: If set, only this user receives the event
