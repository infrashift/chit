version: "2"
linters:
  enable:
    - bodyclose
    - gocritic
    - misspell
    - noctx
    - revive
    - sqlclosecheck
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: unexported-return
          disabled: true
    staticcheck:
      # Every analyzer, including the stylecheck (ST) set that golangci-lint
      # leaves off by default. Excluded: ST1000 (package comments) and ST1003
      # (initialism naming), which would churn exported names for no defect.
      checks:
        - all
        - -ST1000
        - -ST1003
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
