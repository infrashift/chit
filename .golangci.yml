version: "2"
linters:
  enable:
    - bodyclose
    - errorlint # R7: wrap and compare errors correctly (ADR-0004)
    - gochecknoglobals # R6: no mutable package state (ADR-0004)
    - gocritic
    - misspell
    - noctx
    - revive
    - sqlclosecheck
  settings:
    # R7 (ADR-0002, ADR-0004): no error goes to the blank identifier, and
    # each type assertion checks its ok result.
    errcheck:
      check-blank: true
      check-type-assertions: true
    # R4 and R1 (ADR-0002, ADR-0004): Phase 8 enables these linters.
    funlen:
      lines: 60
      statements: -1
      ignore-comments: false
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: unexported-return
          disabled: true
    staticcheck:
      # Every analyzer, including the stylecheck (ST) set that golangci-lint
      # leaves off by default. Excluded: ST1000 (package comments) and ST1003
      # (initialism naming), which would churn exported names for no defect.
      checks:
        - all
        - -ST1000
        - -ST1003
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
