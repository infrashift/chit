version: "2"
linters:
  enable:
    - errorlint # R7: wrap and compare errors correctly (ADR-0004)
    - misspell
  settings:
    # R7 (ADR-0002, ADR-0004): no error goes to the blank identifier, and
    # each type assertion checks its ok result.
    errcheck:
      check-blank: true
      check-type-assertions: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
