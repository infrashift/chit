---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-kratos-config
data:
  kratos.yml: |
    version: v26.2.0

    serve:
      public:
        base_url: http://localhost:4433/
        cors:
          enabled: true
      admin:
        base_url: http://localhost:4434/

    selfservice:
      default_browser_return_url: http://localhost:4455/
      allowed_return_urls:
        - http://localhost:4455/

      methods:
        password:
          enabled: true

      flows:
        registration:
          enabled: true
          ui_url: http://localhost:4455/auth/registration
          after:
            password:
              hooks: []

        login:
          ui_url: http://localhost:4455/auth/login

        settings:
          ui_url: http://localhost:4455/auth/settings

        verification:
          enabled: false

        recovery:
          enabled: false

    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/kratos/identity.schema.json
        # Email only, like HALO's schema: Chit derives the username. Used by
        # tests/e2e/test_e2e.sh scenario 10.
        - id: email-only
          url: file:///etc/kratos/identity.email-only.schema.json

    log:
      level: info
      format: json

    hashers:
      argon2:
        parallelism: 1
        memory: 128MB
        iterations: 2
        salt_length: 16
        key_length: 16

  identity.schema.json: |
    {
      "$id": "https://schemas.chit.infrashift.com/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Chit Identity",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "Email",
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                }
              }
            },
            "username": {
              "type": "string",
              "title": "Username",
              "minLength": 2,
              "maxLength": 64,
              "pattern": "^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$"
            },
            "display_name": {
              "type": "string",
              "title": "Display Name",
              "minLength": 1,
              "maxLength": 100
            }
          },
          "required": ["email", "username", "display_name"],
          "additionalProperties": false
        }
      }
    }
  identity.email-only.schema.json: |
    {
      "$id": "https://schemas.chit.infrashift.com/identity.email-only.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Email-only Identity",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "Email",
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                }
              }
            }
          },
          "required": ["email"],
          "additionalProperties": false
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-oathkeeper-config
data:
  oathkeeper.yml: |
    serve:
      proxy:
        port: 4455
      api:
        port: 4456

    access_rules:
      matching_strategy: glob
      repositories:
        - file:///etc/oathkeeper/access-rules.yml

    authenticators:
      # Humans: Kratos session token in X-Session-Token.
      bearer_token:
        enabled: true
        config:
          check_session_url: http://localhost:4433/sessions/whoami
          preserve_path: true
          extra_from: "@this"
          subject_from: "identity.id"
          force_method: GET
          token_from:
            header: X-Session-Token
          forward_http_headers:
            - X-Session-Token

      # Machine actors: Hydra client_credentials token in Authorization.
      # Takes neither subject_from nor extra_from (Oathkeeper rejects them):
      # .Subject is the introspected `sub` — the client_id for this grant —
      # and .Extra is the response's `ext`, empty for client_credentials.
      oauth2_introspection:
        enabled: true
        config:
          introspection_url: http://localhost:4445/admin/oauth2/introspect
          scope_strategy: exact

      noop:
        enabled: true

    authorizers:
      allow:
        enabled: true

    mutators:
      header:
        enabled: true
        config:
          headers:
            # Exactly one carries an identity; the other is blanked so a
            # smuggled header can never reach the backend. .Extra.identity is
            # set only by the Kratos authenticator (extra_from "@this"),
            # which is what distinguishes the two paths.
            X-User-Id: '{{ if .Extra.identity }}{{ print .Subject }}{{ end }}'
            X-Client-Id: '{{ if .Extra.identity }}{{ else }}{{ print .Subject }}{{ end }}'
      noop:
        enabled: true

    log:
      level: info
      format: json

  access-rules.yml: |
    # RULES MUST BE MUTUALLY EXCLUSIVE — Oathkeeper fails a request matching
    # two rules with 500 "Expected exactly one rule but found multiple rules".
    # Hence the method split over one URL glob rather than per-endpoint rules.
    #
    # Note: search and batch-tag endpoints are POSTs despite only reading, so
    # they require chit:write. Grant both scopes to an agent that searches.
    - id: "chit-api-read"
      upstream:
        url: "http://localhost:8065"
      match:
        # Includes GET /api/v1/websocket, which is read-only in effect.
        url: "http://localhost:4455/api/v1/<**>"
        methods:
          - GET
      authenticators:
        - handler: oauth2_introspection
          config:
            required_scope:
              - "chit:read"
            target_audience:
              - "chit"
        - handler: bearer_token
      authorizer:
        handler: allow
      mutators:
        - handler: header

    - id: "chit-api-write"
      upstream:
        url: "http://localhost:8065"
      match:
        url: "http://localhost:4455/api/v1/<**>"
        methods:
          - POST
          - PUT
          - DELETE
      authenticators:
        - handler: oauth2_introspection
          config:
            required_scope:
              - "chit:write"
            target_audience:
              - "chit"
        - handler: bearer_token
      authorizer:
        handler: allow
      mutators:
        - handler: header

    - id: "kratos-public"
      upstream:
        url: "http://localhost:4433"
        strip_path: /kratos
      match:
        url: "http://localhost:4455/kratos/<**>"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
      authenticators:
        - handler: noop
      authorizer:
        handler: allow
      mutators:
        - handler: noop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-hydra-config
data:
  hydra.yml: |
    version: v26.2.0

    serve:
      public:
        port: 4444
      admin:
        port: 4445
      cookies:
        same_site_mode: Lax

    urls:
      self:
        issuer: http://localhost:4444/

    oidc:
      subject_identifiers:
        supported_types:
          - public

    strategies:
      access_token: opaque

    ttl:
      # Short-lived: agents refresh transparently, so a leaked token expires
      # quickly.
      access_token: 1h

    secrets:
      # CHANGE FOR PRODUCTION.
      system:
        - hydra-system-secret-change-me

    log:
      level: info
      format: json
      leak_sensitive_values: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-keto-config
# A copy of deploy/keto/keto.yml. TestKetoSchemaInSync fails when they differ.
data:
  keto.yml: |
    # keto-cue configuration. keto-cue is the Ory Keto fork that reads the
    # permission schema in CUE. namespaces.location is a directory: keto-cue
    # compiles every *.cue file in it as one package, so services that share
    # this keto-cue each add one file (see schema/chit.cue). The kube files
    # mount this file at /etc/keto and schema/ at /etc/keto/schema. DSN comes
    # from the environment.
    serve:
      read:
        host: 0.0.0.0
        port: 4466
      write:
        host: 0.0.0.0
        port: 4467

    namespaces:
      location: file:///etc/keto/schema

    log:
      level: info
      format: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-keto-schema
# Chit's file of the shared keto-cue schema directory, a copy of
# deploy/keto/schema/chit.cue. A service that shares this keto-cue adds its
# own file to the directory. TestKetoSchemaInSync fails when they differ.
data:
  chit.cue: |
    // Chit's part of the keto-cue permission schema.
    //
    // One keto-cue instance serves Chit and HALO. keto-cue compiles every *.cue
    // file of its schema directory (namespaces.location) as ONE CUE package, so
    // each service ships one file and every file follows these rules:
    //
    //   - The package clause is `package keto`, the name of keto-cue's base
    //     schema. Two different package names in one directory are an error.
    //   - A service declares namespaces only under its own prefix: Chit uses
    //     "chit/...". CUE unifies a namespace that two files declare instead of
    //     refusing it, so a shared name would silently merge two services' rules.
    //   - Definitions (#name) and hidden fields (_name) are package-wide too:
    //     prefix them with the service name (#chit_...).
    //   - A file may refer to another service's namespace as a subject type,
    //     for example ["chit/actor"].
    //
    // `make keto-validate` compiles this file alone and next to a sample HALO
    // file (internal/keto/testdata/halo.cue). The chit-keto-schema ConfigMap in
    // deploy/chit.kube.yml and deploy/chit-uat.kube.yml carries a copy, and
    // TestKetoSchemaInSync keeps them the same.
    //
    // The schema declares only what Chit writes and checks. Keto runs in its
    // default, non-strict mode, so a check follows every subject set, exactly as
    // the namespace list of Keto v0.12 did.
    package keto

    namespaces: {
    	// The subject type of the subject IDs that Chit writes: a user ID in
    	// chit/channel, and "Actor:<user ID>" in chit/command. Keto does not
    	// type-check a subject ID; this namespace only names it. No tuple lives
    	// here.
    	"chit/actor": {}

    	// A mirror of channel_members, written best-effort. Chit never checks it
    	// to grant access: <channel ID>#member@<user ID>.
    	"chit/channel": relations: member: ["chit/actor"]

    	// Slash-command authorization. chit-reconcile owns this namespace.
    	//   Role:<name>#member@Actor:<user ID>
    	//   Command:<slug>#execute@chit/command:Role:<name>#member
    	"chit/command": relations: {
    		member: ["chit/actor"]
    		execute: ["chit/command#member"]
    	}
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-seaweedfs-config
# The S3 identity chitd uses for attachments (CHIT_S3_ACCESS_KEY_ID and
# CHIT_S3_SECRET_ACCESS_KEY). With an identity file the gateway refuses
# anonymous requests. Dev credentials: never copy them into a deployment.
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "chitd",
          "credentials": [
            {"accessKey": "chit-dev-access-key", "secretKey": "chit-dev-secret-key"}
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
# Pod 1: Database — starts PostgreSQL immediately
apiVersion: v1
kind: Pod
metadata:
  name: chit-db
  labels:
    app: chit
    component: db
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: ghcr.io/infrashift/trusted-service-containers/trusted/postgresql17:17.12-9410cd4@sha256:6375c284b5aaa6d83096d74ae6b1b7a3340bcd81739e4309465b18a3e781d6e3
      env:
        - name: POSTGRES_USER
          value: chit
        - name: POSTGRES_PASSWORD
          value: chit
        - name: POSTGRES_DB
          value: chit
      # The TSC postgresql17 image: the signed PGDG RPMs on UBI9 Minimal. It
      # runs as UID 26 with primary group 0 and refuses root. The volume
      # mounts at /var/lib/pgsql/data and the cluster lives one level down,
      # PGDATA=/var/lib/pgsql/data/userdata; the entrypoint creates it on an
      # empty volume. A volume from the DHI image (UID 70,
      # /var/lib/postgresql/17/data) does not mount here: dump and restore it,
      # see the upgrade notes. The app pod's ensure-databases init container
      # creates the Ory databases on every start.
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/pgsql/data

  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: chit-pgdata
---
# Pod 2: App — init containers wait for postgres, run migrations, then start services
apiVersion: v1
kind: Pod
metadata:
  name: chit-app
  labels:
    app: chit
    component: app
spec:
  restartPolicy: Always

  initContainers:
    - name: wait-postgres
      image: ghcr.io/infrashift/trusted-service-containers/trusted/postgresql17:17.12-9410cd4@sha256:6375c284b5aaa6d83096d74ae6b1b7a3340bcd81739e4309465b18a3e781d6e3
      command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U chit; do
            echo "PostgreSQL not ready, retrying in 2s..."
            sleep 2
          done
          echo "PostgreSQL is ready."

    # The only place the Ory databases are created. An init script in
    # /docker-entrypoint-initdb.d would run only on a *fresh* data
    # directory. Creating them idempotently here also
    # upgrades an existing chit-pgdata volume that lacks one (for example
    # 'database "hydra" does not exist').
    - name: ensure-databases
      image: ghcr.io/infrashift/trusted-service-containers/trusted/postgresql17:17.12-9410cd4@sha256:6375c284b5aaa6d83096d74ae6b1b7a3340bcd81739e4309465b18a3e781d6e3
      env:
        - name: PGPASSWORD
          value: chit
      command:
        - sh
        - -c
        - |
          set -e
          for db in kratos keto hydra; do
            if [ "$(psql -h localhost -U chit -d postgres -tAc \
                 "SELECT 1 FROM pg_database WHERE datname='$db'")" = 1 ]; then
              echo "database $db already exists"
            else
              echo "creating database $db"
              createdb -h localhost -U chit "$db"
            fi
          done

    - name: migrate-kratos
      image: ghcr.io/infrashift/trusted-service-containers/trusted/kratos:v26.2.0-382cdac@sha256:3162b223e4190e51ecf5e66159b324de3d50c6ca720f935118919717b83eb817
      command:
        - kratos
        - migrate
        - sql
        - postgres://chit:chit@localhost:5432/kratos?sslmode=disable
        - --yes

    - name: migrate-keto
      image: ghcr.io/infrashift/trusted-service-containers/trusted/keto-cue:v0.0.0-20261114211924-809351b32b9c-6a44b89@sha256:db55bf1db0721e03d6ea8fc250ded0271087a889a013f5dc36dbb5addeac0e9b
      command:
        - keto
        - migrate
        - up
        - --yes
        - -c
        - /etc/keto/keto.yml
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/keto?sslmode=disable
      volumeMounts:
        - name: keto-config
          mountPath: /etc/keto
        - name: keto-schema
          mountPath: /etc/keto/schema

    - name: migrate-hydra
      image: ghcr.io/infrashift/trusted-service-containers/trusted/hydra:v26.2.0-382cdac@sha256:9fec07541f34f4f4ea83b7f3c834647e9b3c21f5b4403a547bf98454f4b1b2e7
      command:
        - hydra
        - migrate
        - sql
        - --yes
        - --read-from-env
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/hydra?sslmode=disable

    - name: migrate-chit
      # Not in trusted-service-containers (gap): upstream, pinned by digest.
      image: docker.io/migrate/migrate:v4.15.0@sha256:f613168b682b4c17033a1d5b381e0cb474c05715b843f4b160fb7bab9cead0c5
      args:
        - -database
        - postgres://chit:chit@localhost:5432/chit?sslmode=disable
        - -path
        - /migrations
        - up
      volumeMounts:
        - name: chit-migrations
          mountPath: /migrations
          readOnly: true

  containers:
    - name: kratos
      image: ghcr.io/infrashift/trusted-service-containers/trusted/kratos:v26.2.0-382cdac@sha256:3162b223e4190e51ecf5e66159b324de3d50c6ca720f935118919717b83eb817
      args:
        - serve
        - --config
        - /etc/kratos/kratos.yml
        - --dev
        - --watch-courier
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/kratos?sslmode=disable
      volumeMounts:
        - name: kratos-config
          mountPath: /etc/kratos

    - name: keto
      image: ghcr.io/infrashift/trusted-service-containers/trusted/keto-cue:v0.0.0-20261114211924-809351b32b9c-6a44b89@sha256:db55bf1db0721e03d6ea8fc250ded0271087a889a013f5dc36dbb5addeac0e9b
      args:
        - serve
        - -c
        - /etc/keto/keto.yml
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/keto?sslmode=disable
      volumeMounts:
        - name: keto-config
          mountPath: /etc/keto
        - name: keto-schema
          mountPath: /etc/keto/schema

    - name: hydra
      image: ghcr.io/infrashift/trusted-service-containers/trusted/hydra:v26.2.0-382cdac@sha256:9fec07541f34f4f4ea83b7f3c834647e9b3c21f5b4403a547bf98454f4b1b2e7
      args:
        - serve
        - all
        - --config
        - /etc/hydra/hydra.yml
        # Dev only: serves the public and admin APIs over plain HTTP.
        - --dev
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/hydra?sslmode=disable
      volumeMounts:
        - name: hydra-config
          mountPath: /etc/hydra

    - name: oathkeeper
      image: ghcr.io/infrashift/trusted-service-containers/trusted/oathkeeper:v26.2.0-382cdac@sha256:dfa66c5314c05c864f8e8bcbf946ce9e6c9c8d2840c7c52ebe0b4048142c7288
      args:
        - serve
        - --config
        - /etc/oathkeeper/oathkeeper.yml
      volumeMounts:
        - name: oathkeeper-config
          mountPath: /etc/oathkeeper

    - name: zincsearch
      # Not in trusted-service-containers (gap): upstream, pinned by digest.
      image: public.ecr.aws/zinclabs/zincsearch:0.4.10@sha256:fd865f7d0393428479726117c9f3b827e26eaee7f2fb21a22d8bc894e8f8f40e
      env:
        - name: ZINC_FIRST_ADMIN_USER
          value: admin
        - name: ZINC_FIRST_ADMIN_PASSWORD
          value: admin
        - name: ZINC_DATA_PATH
          value: /data
      volumeMounts:
        - name: zincdata
          mountPath: /data

    - name: seaweedfs
      # The attachment store (CHIT_S3_*): trusted-service-containers
      # SeaweedFS 4.51, built from source on ubi9-micro, pinned by digest.
      # One weed process runs the master, a volume server, the filer and the
      # S3 gateway, all on 127.0.0.1. The ports avoid 8080 (the volume
      # server's default) and the gateway's default gRPC port 18333.
      # chitd creates the chit-files bucket at start.
      image: ghcr.io/infrashift/trusted-service-containers/trusted/seaweedfs:4.51-382cdac@sha256:7c6682e56006764282eb70a6a96703aafa6d808cd0c13ff6b8b1514b680985b7
      args:
        - server
        - -dir=/data
        - -ip=127.0.0.1
        - -ip.bind=127.0.0.1
        - -master.port=9333
        - -master.port.grpc=19333
        - -master.volumeSizeLimitMB=1024
        - -volume.port=8380
        - -volume.port.grpc=18380
        - -filer.port=8888
        - -filer.port.grpc=18888
        - -s3
        - -s3.port=8333
        - -s3.port.grpc=18334
        - -s3.port.iceberg=0
        - -s3.port.lance=0
        - -s3.config=/etc/seaweedfs/s3.json
      volumeMounts:
        - name: seaweedfs-config
          mountPath: /etc/seaweedfs
        - name: seaweeddata
          mountPath: /data

    - name: chitd
      image: localhost/chit:latest
      env:
        - name: CHIT_DATABASE_URL
          value: postgres://chit:chit@localhost:5432/chit?sslmode=disable
        - name: CHIT_KRATOS_ADMIN_URL
          value: http://localhost:4434
        - name: CHIT_KETO_READ_URL
          value: http://localhost:4466
        - name: CHIT_KETO_WRITE_URL
          value: http://localhost:4467
        - name: CHIT_ZINCSEARCH_URL
          value: http://localhost:4080
        - name: CHIT_ZINCSEARCH_USER
          value: admin
        - name: CHIT_ZINCSEARCH_PASSWORD
          value: admin
        - name: CHIT_S3_ENDPOINT
          value: http://127.0.0.1:8333
        - name: CHIT_S3_ACCESS_KEY_ID
          value: chit-dev-access-key
        - name: CHIT_S3_SECRET_ACCESS_KEY
          value: chit-dev-secret-key
        # A HALO-like machine actor for tests/e2e/test_e2e.sh scenario 10,
        # which creates the Hydra client chit-e2e-halod. It may act on
        # behalf of any person: never copy it into a real deployment.
        # chit-e2e-bot (scenario 11) is a machine actor that may not.
        - name: CHIT_MACHINE_ACTORS
          value: '[{"client_id":"chit-e2e-halod","username":"halod-e2e","display_name":"halod (e2e)","roles":"system_user","actor_type":"agent"},{"client_id":"chit-e2e-bot","username":"bot-e2e","display_name":"bot (e2e)","roles":"system_user","actor_type":"bot"}]'
        - name: CHIT_ON_BEHALF_OF_CLIENTS
          value: chit-e2e-halod

  volumes:
    - name: kratos-config
      configMap:
        name: chit-kratos-config
    - name: oathkeeper-config
      configMap:
        name: chit-oathkeeper-config
    - name: keto-config
      configMap:
        name: chit-keto-config
    - name: keto-schema
      configMap:
        name: chit-keto-schema
    - name: hydra-config
      configMap:
        name: chit-hydra-config
    - name: seaweedfs-config
      configMap:
        name: chit-seaweedfs-config
    - name: seaweeddata
      persistentVolumeClaim:
        claimName: chit-seaweeddata
    - name: zincdata
      persistentVolumeClaim:
        claimName: chit-zincdata
    - name: chit-migrations
      hostPath:
        path: __PROJECT_ROOT__/migrations
        type: Directory
