# keto-cue configuration. keto-cue is the Ory Keto fork that reads the
# permission schema in CUE (namespaces.cue, next to this file). The kube files
# mount both at /etc/keto. DSN comes from the environment.
serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

namespaces:
  location: file:///etc/keto/namespaces.cue

log:
  level: info
  format: json
