- id: "chit-api"
  upstream:
    url: "http://localhost:8065"
  match:
    url: "http://localhost:4455/api/v1/<**>"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
  authenticators:
    - handler: bearer_token
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: header

- id: "kratos-public"
  upstream:
    url: "http://localhost:4433"
    strip_path: /kratos
  match:
    url: "http://localhost:4455/kratos/<**>"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
