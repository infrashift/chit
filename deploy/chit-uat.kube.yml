---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-kratos-config
data:
  kratos.yml: |
    version: v26.2.0

    serve:
      public:
        base_url: http://localhost:4433/
        cors:
          enabled: true
      admin:
        base_url: http://localhost:4434/

    selfservice:
      default_browser_return_url: http://localhost:4455/
      allowed_return_urls:
        - http://localhost:4455/

      methods:
        password:
          enabled: true

      flows:
        registration:
          enabled: true
          ui_url: http://localhost:4455/auth/registration
          after:
            password:
              hooks: []

        login:
          ui_url: http://localhost:4455/auth/login

        settings:
          ui_url: http://localhost:4455/auth/settings

        verification:
          enabled: false

        recovery:
          enabled: false

    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/kratos/identity.schema.json

    log:
      level: info
      format: json

    hashers:
      argon2:
        parallelism: 1
        memory: 128MB
        iterations: 2
        salt_length: 16
        key_length: 16

  identity.schema.json: |
    {
      "$id": "https://schemas.chit.infrashift.com/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Chit Identity",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "Email",
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                }
              }
            },
            "username": {
              "type": "string",
              "title": "Username",
              "minLength": 2,
              "maxLength": 64,
              "pattern": "^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$"
            },
            "display_name": {
              "type": "string",
              "title": "Display Name",
              "minLength": 1,
              "maxLength": 100
            }
          },
          "required": ["email", "username", "display_name"],
          "additionalProperties": false
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-oathkeeper-config
data:
  oathkeeper.yml: |
    serve:
      proxy:
        port: 4455
      api:
        port: 4456

    access_rules:
      matching_strategy: glob
      repositories:
        - file:///etc/oathkeeper/access-rules.yml

    authenticators:
      bearer_token:
        enabled: true
        config:
          check_session_url: http://localhost:4433/sessions/whoami
          preserve_path: true
          extra_from: "@this"
          subject_from: "identity.id"
          force_method: GET
          token_from:
            header: X-Session-Token
          forward_http_headers:
            - X-Session-Token
      noop:
        enabled: true

    authorizers:
      allow:
        enabled: true

    mutators:
      header:
        enabled: true
        config:
          headers:
            X-User-Id: "{{ print .Subject }}"
      noop:
        enabled: true

    log:
      level: info
      format: json

  access-rules.yml: |
    - id: "chit-api"
      upstream:
        url: "http://localhost:8065"
      match:
        url: "http://localhost:4455/api/v1/<**>"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
      authenticators:
        - handler: bearer_token
        - handler: noop
      authorizer:
        handler: allow
      mutators:
        - handler: header

    - id: "kratos-public"
      upstream:
        url: "http://localhost:4433"
        strip_path: /kratos
      match:
        url: "http://localhost:4455/kratos/<**>"
        methods:
          - GET
          - POST
          - PUT
          - DELETE
      authenticators:
        - handler: noop
      authorizer:
        handler: allow
      mutators:
        - handler: noop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-keto-config
# A copy of deploy/keto/keto.yml. TestKetoSchemaInSync fails when they differ.
data:
  keto.yml: |
    # keto-cue configuration. keto-cue is the Ory Keto fork that reads the
    # permission schema in CUE. namespaces.location is a directory: keto-cue
    # compiles every *.cue file in it as one package, so services that share
    # this keto-cue each add one file (see schema/chit.cue). The kube files
    # mount this file at /etc/keto and schema/ at /etc/keto/schema. DSN comes
    # from the environment.
    serve:
      read:
        host: 0.0.0.0
        port: 4466
      write:
        host: 0.0.0.0
        port: 4467

    namespaces:
      location: file:///etc/keto/schema

    log:
      level: info
      format: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-keto-schema
# Chit's file of the shared keto-cue schema directory, a copy of
# deploy/keto/schema/chit.cue. A service that shares this keto-cue adds its
# own file to the directory. TestKetoSchemaInSync fails when they differ.
data:
  chit.cue: |
    // Chit's part of the keto-cue permission schema.
    //
    // One keto-cue instance serves Chit and HALO. keto-cue compiles every *.cue
    // file of its schema directory (namespaces.location) as ONE CUE package, so
    // each service ships one file and every file follows these rules:
    //
    //   - The package clause is `package keto`, the name of keto-cue's base
    //     schema. Two different package names in one directory are an error.
    //   - A service declares namespaces only under its own prefix: Chit uses
    //     "chit/...". CUE unifies a namespace that two files declare instead of
    //     refusing it, so a shared name would silently merge two services' rules.
    //   - Definitions (#name) and hidden fields (_name) are package-wide too:
    //     prefix them with the service name (#chit_...).
    //   - A file may refer to another service's namespace as a subject type,
    //     for example ["chit/actor"].
    //
    // `make keto-validate` compiles this file alone and next to a sample HALO
    // file (internal/keto/testdata/halo.cue). The chit-keto-schema ConfigMap in
    // deploy/chit.kube.yml and deploy/chit-uat.kube.yml carries a copy, and
    // TestKetoSchemaInSync keeps them the same.
    //
    // The schema declares only what Chit writes and checks. Keto runs in its
    // default, non-strict mode, so a check follows every subject set, exactly as
    // the namespace list of Keto v0.12 did.
    package keto

    namespaces: {
    	// The subject type of the subject IDs that Chit writes: a user ID in
    	// chit/channel, and "Actor:<user ID>" in chit/command. Keto does not
    	// type-check a subject ID; this namespace only names it. No tuple lives
    	// here.
    	"chit/actor": {}

    	// A mirror of channel_members, written best-effort. Chit never checks it
    	// to grant access: <channel ID>#member@<user ID>.
    	"chit/channel": relations: member: ["chit/actor"]

    	// Slash-command authorization. chit-reconcile owns this namespace.
    	//   Role:<name>#member@Actor:<user ID>
    	//   Command:<slug>#execute@chit/command:Role:<name>#member
    	"chit/command": relations: {
    		member: ["chit/actor"]
    		execute: ["chit/command#member"]
    	}
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chit-seaweedfs-config
# The S3 identity chitd uses for attachments (CHIT_S3_ACCESS_KEY_ID and
# CHIT_S3_SECRET_ACCESS_KEY). With an identity file the gateway refuses
# anonymous requests. Dev credentials: never copy them into a deployment.
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "chitd",
          "credentials": [
            {"accessKey": "chit-dev-access-key", "secretKey": "chit-dev-secret-key"}
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
# Pod 1: Database — starts PostgreSQL immediately
apiVersion: v1
kind: Pod
metadata:
  name: chit-uat-db
  labels:
    app: chit
    component: db
    env: uat
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: ghcr.io/infrashift/trusted-service-containers/quarantine/postgres:17-debian-382cdac@sha256:66dcbc496311685361b6a56e261e6694454daea3e297604dfd79590275f03910
      env:
        - name: POSTGRES_USER
          value: chit
        - name: POSTGRES_PASSWORD
          value: chit
        - name: POSTGRES_DB
          value: chit
      # The TSC image is the Debian-based Docker Hardened Image: PGDATA is
      # /var/lib/postgresql/17/data, and it runs as UID 70 like the Alpine
      # image did, so a volume from 17-alpine mounts here unchanged. Its
      # entrypoint does not run /docker-entrypoint-initdb.d; the app pod's
      # ensure-databases init container creates the Ory databases. Text
      # indexes built under Alpine's musl need a REINDEX: see the upgrade notes.
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/17/data

  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: chit-uat-pgdata
---
# Pod 2: App — init containers wait for postgres, run migrations, seed UAT data, then start services
apiVersion: v1
kind: Pod
metadata:
  name: chit-uat-app
  labels:
    app: chit
    component: app
    env: uat
spec:
  restartPolicy: Always

  initContainers:
    - name: wait-postgres
      image: ghcr.io/infrashift/trusted-service-containers/quarantine/postgres:17-debian-382cdac@sha256:66dcbc496311685361b6a56e261e6694454daea3e297604dfd79590275f03910
      command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U chit; do
            echo "PostgreSQL not ready, retrying in 2s..."
            sleep 2
          done
          echo "PostgreSQL is ready."

    # The postgres entrypoint does not run init scripts, so create the Ory
    # databases here, idempotently, before their migrations.
    - name: ensure-databases
      image: ghcr.io/infrashift/trusted-service-containers/quarantine/postgres:17-debian-382cdac@sha256:66dcbc496311685361b6a56e261e6694454daea3e297604dfd79590275f03910
      env:
        - name: PGPASSWORD
          value: chit
      command:
        - sh
        - -c
        - |
          set -e
          for db in kratos keto; do
            # No grep: the hardened postgres image does not ship it.
            if [ "$(psql -h localhost -U chit -d postgres -tAc \
                 "SELECT 1 FROM pg_database WHERE datname='$db'")" = 1 ]; then
              echo "database $db already exists"
            else
              echo "creating database $db"
              createdb -h localhost -U chit "$db"
            fi
          done

    - name: migrate-kratos
      image: ghcr.io/infrashift/trusted-service-containers/trusted/kratos:v26.2.0-382cdac@sha256:3162b223e4190e51ecf5e66159b324de3d50c6ca720f935118919717b83eb817
      command:
        - kratos
        - migrate
        - sql
        - postgres://chit:chit@localhost:5432/kratos?sslmode=disable
        - --yes

    - name: migrate-keto
      # PENDING trusted-service-containers P-TSC-2: keto-cue has no trusted
      # image yet. `make keto-cue-image` builds this local one; replace it
      # with the TSC image pinned by digest when P-TSC-2 publishes it.
      image: localhost/keto-cue:2a6c583e
      command:
        - keto
        - migrate
        - up
        - --yes
        - -c
        - /etc/keto/keto.yml
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/keto?sslmode=disable
      volumeMounts:
        - name: keto-config
          mountPath: /etc/keto
        - name: keto-schema
          mountPath: /etc/keto/schema

    - name: migrate-chit
      # Not in trusted-service-containers (gap): upstream, pinned by digest.
      image: docker.io/migrate/migrate:v4.15.0@sha256:f613168b682b4c17033a1d5b381e0cb474c05715b843f4b160fb7bab9cead0c5
      args:
        - -database
        - postgres://chit:chit@localhost:5432/chit?sslmode=disable
        - -path
        - /migrations
        - up
      volumeMounts:
        - name: chit-migrations
          mountPath: /migrations
          readOnly: true

    - name: seed-uat
      image: chit-e2e:latest
      command: ["go", "run", "/src/scripts/seed-uat/main.go"]
      env:
        - name: CHIT_DATABASE_URL
          value: postgres://chit:chit@localhost:5432/chit?sslmode=disable

  containers:
    - name: kratos
      image: ghcr.io/infrashift/trusted-service-containers/trusted/kratos:v26.2.0-382cdac@sha256:3162b223e4190e51ecf5e66159b324de3d50c6ca720f935118919717b83eb817
      args:
        - serve
        - --config
        - /etc/kratos/kratos.yml
        - --dev
        - --watch-courier
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/kratos?sslmode=disable
      volumeMounts:
        - name: kratos-config
          mountPath: /etc/kratos

    - name: keto
      # PENDING trusted-service-containers P-TSC-2: keto-cue has no trusted
      # image yet. `make keto-cue-image` builds this local one; replace it
      # with the TSC image pinned by digest when P-TSC-2 publishes it.
      image: localhost/keto-cue:2a6c583e
      args:
        - serve
        - -c
        - /etc/keto/keto.yml
      env:
        - name: DSN
          value: postgres://chit:chit@localhost:5432/keto?sslmode=disable
      volumeMounts:
        - name: keto-config
          mountPath: /etc/keto
        - name: keto-schema
          mountPath: /etc/keto/schema

    - name: oathkeeper
      image: ghcr.io/infrashift/trusted-service-containers/trusted/oathkeeper:v26.2.0-382cdac@sha256:dfa66c5314c05c864f8e8bcbf946ce9e6c9c8d2840c7c52ebe0b4048142c7288
      args:
        - serve
        - --config
        - /etc/oathkeeper/oathkeeper.yml
      volumeMounts:
        - name: oathkeeper-config
          mountPath: /etc/oathkeeper

    - name: zincsearch
      # Not in trusted-service-containers (gap): upstream, pinned by digest.
      image: public.ecr.aws/zinclabs/zincsearch:0.4.10@sha256:fd865f7d0393428479726117c9f3b827e26eaee7f2fb21a22d8bc894e8f8f40e
      env:
        - name: ZINC_FIRST_ADMIN_USER
          value: admin
        - name: ZINC_FIRST_ADMIN_PASSWORD
          value: admin
        - name: ZINC_DATA_PATH
          value: /data
      volumeMounts:
        - name: zincdata
          mountPath: /data

    - name: seaweedfs
      # The attachment store (CHIT_S3_*): trusted-service-containers
      # SeaweedFS 4.51, built from source on ubi9-micro, pinned by digest.
      # One weed process runs the master, a volume server, the filer and the
      # S3 gateway, all on 127.0.0.1. The ports avoid 8080 (the volume
      # server's default) and the gateway's default gRPC port 18333.
      # chitd creates the chit-files bucket at start.
      image: ghcr.io/infrashift/trusted-service-containers/trusted/seaweedfs:4.51-382cdac@sha256:7c6682e56006764282eb70a6a96703aafa6d808cd0c13ff6b8b1514b680985b7
      args:
        - server
        - -dir=/data
        - -ip=127.0.0.1
        - -ip.bind=127.0.0.1
        - -master.port=9333
        - -master.port.grpc=19333
        - -master.volumeSizeLimitMB=1024
        - -volume.port=8380
        - -volume.port.grpc=18380
        - -filer.port=8888
        - -filer.port.grpc=18888
        - -s3
        - -s3.port=8333
        - -s3.port.grpc=18334
        - -s3.port.iceberg=0
        - -s3.port.lance=0
        - -s3.config=/etc/seaweedfs/s3.json
      volumeMounts:
        - name: seaweedfs-config
          mountPath: /etc/seaweedfs
        - name: seaweeddata
          mountPath: /data

    - name: chitd
      image: localhost/chit:latest
      env:
        - name: CHIT_DATABASE_URL
          value: postgres://chit:chit@localhost:5432/chit?sslmode=disable
        - name: CHIT_KRATOS_ADMIN_URL
          value: http://localhost:4434
        - name: CHIT_KETO_READ_URL
          value: http://localhost:4466
        - name: CHIT_KETO_WRITE_URL
          value: http://localhost:4467
        - name: CHIT_ZINCSEARCH_URL
          value: http://localhost:4080
        - name: CHIT_ZINCSEARCH_USER
          value: admin
        - name: CHIT_ZINCSEARCH_PASSWORD
          value: admin
        - name: CHIT_S3_ENDPOINT
          value: http://127.0.0.1:8333
        - name: CHIT_S3_ACCESS_KEY_ID
          value: chit-dev-access-key
        - name: CHIT_S3_SECRET_ACCESS_KEY
          value: chit-dev-secret-key

  volumes:
    - name: kratos-config
      configMap:
        name: chit-kratos-config
    - name: oathkeeper-config
      configMap:
        name: chit-oathkeeper-config
    - name: keto-config
      configMap:
        name: chit-keto-config
    - name: keto-schema
      configMap:
        name: chit-keto-schema
    - name: seaweedfs-config
      configMap:
        name: chit-seaweedfs-config
    - name: seaweeddata
      persistentVolumeClaim:
        claimName: chit-uat-seaweeddata
    - name: zincdata
      persistentVolumeClaim:
        claimName: chit-uat-zincdata
    - name: chit-migrations
      hostPath:
        path: __PROJECT_ROOT__/migrations
        type: Directory
